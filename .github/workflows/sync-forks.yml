name: Sync Forks

# Keeps all of your forks up to date with their upstreams, non-destructively.
# Uses GitHub's "Sync fork" (merge-upstream) API: fast-forward only. It never
# deletes anything, and if an upstream was removed or made private the fork is
# simply skipped and left untouched.

on:
  schedule:
    - cron: '0 5 * * *'   # daily at 05:00 UTC
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: sync-forks
  cancel-in-progress: true

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the script)
        uses: actions/checkout@v7

      - name: Sync all forks with upstream
        env:
          # NOTE: the default GITHUB_TOKEN only has access to THIS repo, so it
          # cannot sync your other forks. Create a Personal Access Token with
          # `repo` scope (classic) or fine-grained Contents:read+write across
          # your forks, and save it as the repo secret FORK_SYNC_TOKEN.
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: bash scripts/sync-forks.sh
