name: Update Forks Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger
  repository_dispatch:
    types: [update-forks] # Trigger via API
  push:
    branches:
      - master
    paths:
      - 'scripts/*.js'
      - '.github/workflows/update-forks.yml'

permissions:
  contents: write

concurrency:
  group: update-forks
  cancel-in-progress: true

jobs:
  update-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-save sql.js umap-js

      # Embedding vectors are too large to commit (~570 repos x 1024 dims) and are
      # fully rebuildable, so they persist here rather than in git history. A cold
      # cache just means one run pays to re-embed.
      - name: Restore embeddings cache
        uses: actions/cache@v6
        with:
          path: embeddings.json
          key: embeddings-${{ github.run_id }}
          restore-keys: |
            embeddings-

      - name: Fetch forks and generate feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || '10' }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL || 'nvidia/nv-embedqa-e5-v5' }}
        run: node scripts/update-forks.js

      - name: Build SQLite database
        run: node scripts/build-db.js

      - name: Generate blog pages and RSS feeds
        run: |
          node scripts/generate-blog-pages.js
          node scripts/generate-rss.js

      - name: Code Brain — file structures (new repos) + deep analysis (budgeted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fill file/folder structures for any repos added since last run.
          node scripts/build-structure.js --limit 150 || true
          # Deep static analysis, incremental: a budget per run so giants + new forks
          # get absorbed over successive cron passes. Bump --max-files over time to
          # let ever-larger repos qualify. Skips repos already analyzed.
          node scripts/build-analyze.js --all --budget 40 --max-files 2500 || true
          # Recompute the honest hero stats (repos, languages, files, modules, findings).
          node scripts/build-stats.js || true
          # Read-side build: the lean index, the search index and a sitemap that
          # includes every article. Must run after the pages exist.
          node scripts/build-index.js || true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add forks.json forks.db blog/ feed.xml atom.xml structure/ stats.json data/ sitemap.xml
          git checkout -- . 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update forks feed + code brain structures [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Build status
        run: |
          MISSING=$(node -e "
            const data = require('./forks.json');
            const missing = (data.forks || []).filter(f => !f.knowledgeGraph).length;
            console.log(missing);
          ")
          TOTAL=$(node -e "const data = require('./forks.json'); console.log(data.forks?.length || 0);")
          DB_SIZE=$(stat -c%s forks.db 2>/dev/null || echo 0)
          DB_KB=$((DB_SIZE / 1024))
          echo "Repos: $TOTAL | Missing KG: $MISSING | DB: ${DB_KB}KB"
