name: Update Forks Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger
  repository_dispatch:
    types: [update-forks] # Trigger via API
  push:
    branches:
      - master
    paths:
      - 'scripts/*.js'
      - '.github/workflows/update-forks.yml'

permissions:
  contents: write

concurrency:
  group: update-forks
  cancel-in-progress: true

jobs:
  update-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-save sql.js umap-js web-tree-sitter tree-sitter-python

      # Embedding vectors are too large to commit (~570 repos x 1024 dims) and are
      # fully rebuildable, so they persist here rather than in git history. A cold
      # cache just means one run pays to re-embed.
      - name: Restore embeddings cache
        uses: actions/cache@v6
        with:
          path: embeddings.json
          key: embeddings-${{ github.run_id }}
          restore-keys: |
            embeddings-

      - name: Fetch forks and generate feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || '10' }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL || 'nvidia/nv-embedqa-e5-v5' }}
        run: node scripts/update-forks.js

      - name: Build SQLite database
        run: node scripts/build-db.js

      - name: Generate blog pages and RSS feeds
        run: |
          node scripts/generate-blog-pages.js
          node scripts/generate-rss.js

      - name: Code Brain — file structures (new repos) + deep analysis (budgeted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A failed build step must not read as success. Each one is allowed to
          # fail so the remaining steps still run and the backlog still drains,
          # but the failure is recorded and the job turns red at the end, instead
          # of a crash in build-symbols producing a green run whose next step
          # commits whatever partial state resulted.
          note() { echo "$1" >> "$RUNNER_TEMP/failed-steps.txt"; echo "::error::$1 failed"; }

          # Fill file/folder structures for any repos added since last run.
          node scripts/build-structure.js --limit 150 || note build-structure
          # Deep static analysis, incremental: a budget per run so giants + new forks
          # get absorbed over successive cron passes. Bump --max-files over time to
          # let ever-larger repos qualify. Skips repos already analyzed.
          node scripts/build-analyze.js --all --budget 40 --max-files 2500 || note build-analyze
          # Recompute the honest hero stats (repos, languages, files, modules, findings).
          node scripts/build-stats.js || note build-stats
          # Dependency extraction + registry resolution, budgeted so a run costs a
          # bounded number of requests and the 934-repo backlog drains over time.
          node scripts/build-deps.js --budget 120 --registry 150 || note build-deps
          # Symbol layer via tree-sitter, all five languages. Wall-clock bounded:
          # ~10s per repo, so a 300s slice drains ~30 repos. The backlog is 863
          # after adding TypeScript, JavaScript, Go and Rust, and candidates are
          # interleaved by language so no single language starves the others.
          node scripts/build-symbols.js --lang all --budget 60 --max-seconds 300 || note build-symbols
          # Read-side build: the lean index, the search index and a sitemap that
          # includes every article. Must run after the pages exist.
          # Code-health audit: one tree request per repo plus a bounded number of
          # raw reads, budgeted so a run has a predictable ceiling.
          node scripts/build-hygiene.js --budget 80 --max-seconds 240 || note build-hygiene
          # Named advisories for the declared dependencies. api.osv.dev is
          # unauthenticated and batches 100 packages per request, so the whole
          # estate is about 60 requests; the advisory descriptions are the part
          # that is one request each, hence the separate budget.
          node scripts/build-osv.js --budget 80 --details 150 || note build-osv
          # The grade: a pure join over hygiene, the deep analysis and the
          # advisories, so it costs nothing and must run after all three.
          node scripts/build-grade.js || note build-grade
          node scripts/build-index.js || note build-index

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add forks.json forks.db blog/ feed.xml atom.xml structure/ stats.json data/ sitemap.xml
          git checkout -- . 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update forks feed + code brain structures [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Build status
        run: |
          MISSING=$(node -e "
            const data = require('./forks.json');
            const missing = (data.forks || []).filter(f => !f.knowledgeGraph).length;
            console.log(missing);
          ")
          TOTAL=$(node -e "const data = require('./forks.json'); console.log(data.forks?.length || 0);")
          DB_SIZE=$(stat -c%s forks.db 2>/dev/null || echo 0)
          DB_KB=$((DB_SIZE / 1024))
          echo "Repos: $TOTAL | Missing KG: $MISSING | DB: ${DB_KB}KB"

      # Runs last, after the commit, so a step that crashed still contributes
      # whatever it produced and the run still turns red. Before this the whole
      # build stage ended in `|| true` and a crash was indistinguishable from a
      # clean pass, which the audit flagged against this repository as a high
      # finding and was right to.
      - name: Fail the run if any build step failed
        run: |
          if [ -s "$RUNNER_TEMP/failed-steps.txt" ]; then
            echo "These build steps failed:"
            cat "$RUNNER_TEMP/failed-steps.txt"
            exit 1
          fi
          echo "All build steps succeeded."
