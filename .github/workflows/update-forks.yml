name: Update Forks Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger
  repository_dispatch:
    types: [update-forks] # Trigger via API
  push:
    branches:
      - master
    paths:
      - 'scripts/*.js'
      - '.github/workflows/update-forks.yml'

permissions:
  contents: write

concurrency:
  group: update-forks
  cancel-in-progress: true

jobs:
  update-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install sql.js

      - name: Fetch forks and generate feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || '10' }}
        run: node scripts/update-forks.js

      - name: Build SQLite database
        run: node scripts/build-db.js

      - name: Generate blog pages and RSS feeds
        run: |
          node scripts/generate-blog-pages.js
          node scripts/generate-rss.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add forks.json forks.db blog/ feed.xml atom.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update forks feed [skip ci]" && git pull --rebase && git push)

      - name: Build status
        run: |
          MISSING=$(node -e "
            const data = require('./forks.json');
            const missing = (data.forks || []).filter(f => !f.knowledgeGraph).length;
            console.log(missing);
          ")
          TOTAL=$(node -e "const data = require('./forks.json'); console.log(data.forks?.length || 0);")
          DB_SIZE=$(stat -c%s forks.db 2>/dev/null || echo 0)
          DB_KB=$((DB_SIZE / 1024))
          echo "Repos: $TOTAL | Missing KG: $MISSING | DB: ${DB_KB}KB"
