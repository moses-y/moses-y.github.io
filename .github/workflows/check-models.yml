# Does the model roster still exist?
#
# nv-embedqa-e5-v5 was retired on 2026-08-25 and the pipeline ran green for
# seventeen days afterwards, publishing 127 repositories with no position on the
# semantic graph. The roster is configuration that expires on a vendor's
# schedule, so it gets its own red mark rather than one log line inside a job
# whose other twenty steps succeeded.
name: Check models

on:
  schedule:
    - cron: '17 6 * * 1'   # Monday morning, well before anyone looks at the site
  workflow_dispatch:
    inputs:
      list:
        description: 'Print the full catalogue'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Probe every configured model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL || 'nvidia/nv-embedqa-e5-v5' }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
        run: node src/tools/check-models.js ${{ inputs.list && '--list' || '' }}
