<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Graph | Moses Yebei</title>
    <!-- Code Graph and Code Brain are one page now. This keeps old links,
         including ?repo=<id> deep links, landing on the semantic view. -->
    <link rel="canonical" href="https://moses-y.github.io/code-brain.html">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/code-brain.html?view=semantic">
    <script>
        (function () {
            var q = new URLSearchParams(location.search);
            if (!q.has('view')) q.set('view', 'semantic');
            location.replace('/code-brain.html?' + q.toString() + location.hash);
        })();
    </script>
</head>
<body>
    <p>Code Graph has moved. <a href="/code-brain.html?view=semantic">Open it here</a>.</p>
</body>
</html>
