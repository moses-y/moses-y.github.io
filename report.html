<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Report | Code Brain</title>
    <meta name="author" content="Moses Yebei">
    <meta name="description" content="A deterministic architecture & code-health report for a repository - module coupling, import cycles, and ranked findings.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0a0e1a; --card:rgba(255,255,255,.045); --ink:#f2f1fa; --ink-soft:#c7c3e2; --muted:#8f89ba;
            --line:rgba(255,255,255,.12); --accent:#6a7bff; --accent-ink:#a9b4ff; --gold:#f0b355;
            --err:#ff7d73; --warn:#f0b355; --info:#63b3ff;
            --grad:linear-gradient(92deg,#4da3ff,#6a7bff 45%,#a86bff);
            --serif:'Newsreader',Georgia,'Times New Roman',serif;
            --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        }
        * { box-sizing: border-box; }
        html { background: var(--bg); }
        @view-transition { navigation: auto; }
        body { margin:0; font-family:var(--font); color:var(--ink); line-height:1.6;
            background:radial-gradient(900px 500px at 85% -10%,rgba(106,123,255,.16),transparent 60%),
                       radial-gradient(700px 480px at -10% 110%,rgba(77,163,255,.09),transparent 60%),var(--bg);
            -webkit-font-smoothing:antialiased; }
        .wrap { max-width: 940px; margin: 0 auto; padding: 40px 28px 90px; }
        a { color: var(--accent-ink); }
        .topbar { display:flex; align-items:center; gap:14px; font-size:12px; letter-spacing:2px;
            text-transform:uppercase; color:var(--accent-ink); font-weight:700; }
        .topbar .back { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:600; font-size:13px;
            color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:6px 14px; }
        .topbar .back:hover { color:#fff; border-color:var(--accent); }
        h1 { font-family:var(--serif); font-weight:600; font-size:40px; line-height:1.12; margin:22px 0 8px; letter-spacing:.2px; }
        h1 b { background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .lede { color:var(--ink-soft); font-size:16px; max-width:720px; margin:0 0 6px; }
        .repolinks { font-size:13px; color:var(--muted); margin-top:6px; }
        .repolinks a { margin-right:14px; }
        hr.rule { border:0; border-top:1px solid var(--line); margin:30px 0 26px; }
        .sec { font-family:var(--serif); font-size:15px; font-weight:600; color:var(--muted);
            margin:34px 0 16px; display:flex; gap:10px; align-items:baseline; }
        .sec .no { font-style:italic; color:var(--gold); }
        /* stat tiles */
        .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
            border:1px solid var(--line); border-radius:14px; overflow:hidden; }
        @media(max-width:640px){ .tiles{ grid-template-columns:repeat(2,1fr);} }
        .tile { background:var(--card); padding:22px 20px; }
        .tile .v { font-family:var(--serif); font-size:38px; font-weight:600; line-height:1;
            background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
            font-variant-numeric:tabular-nums; }
        .tile .l { color:var(--muted); font-size:12.5px; margin-top:8px; }
        /* severity + category bars */
        .bars { margin-top:18px; display:grid; gap:10px; }
        .bar { display:flex; align-items:center; gap:12px; font-size:13px; }
        .bar .name { width:130px; color:var(--ink-soft); text-transform:capitalize; }
        .bar .track { flex:1; height:10px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; }
        .bar .fill { height:100%; border-radius:999px; }
        .bar .n { width:44px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
        .fill.high{background:var(--err);} .fill.medium{background:var(--warn);} .fill.low{background:var(--info);}
        .fill.cat{background:linear-gradient(90deg,#4da3ff,#a86bff);}
        /* coupling table */
        table.coupling { width:100%; border-collapse:collapse; font-size:13px; }
        table.coupling th { text-align:left; color:var(--muted); font-weight:600; font-size:11.5px;
            text-transform:uppercase; letter-spacing:.6px; padding:8px 10px; border-bottom:1px solid var(--line); }
        table.coupling td { padding:9px 10px; border-bottom:1px solid var(--line); }
        table.coupling td.mod { font-family:ui-monospace,Menlo,monospace; color:var(--ink); }
        table.coupling td.num { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-soft); }
        .cyc { color:var(--err); font-size:11px; font-weight:600; }
        /* findings */
        .finding { padding:16px 0; border-top:1px solid var(--line); }
        .finding:first-child { border-top:0; }
        .finding .head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
        .finding .dot { width:9px; height:9px; border-radius:50%; flex:none; align-self:center; }
        .dot.high{background:var(--err);} .dot.medium{background:var(--warn);} .dot.low{background:var(--info);}
        .finding .ttl { font-size:15.5px; font-weight:600; color:#fff; }
        .finding .chip { font-size:11px; color:var(--accent-ink); background:rgba(106,123,255,.16);
            border:1px solid rgba(122,140,255,.3); border-radius:999px; padding:2px 10px; text-transform:capitalize; }
        .finding .rankchip { font-size:11px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums; }
        .finding .loc { font-size:12.5px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; margin-top:6px; }
        .finding .ev { font-size:13.5px; color:var(--ink-soft); margin-top:7px; }
        .finding .rec { font-size:13.5px; color:var(--ink-soft); margin-top:6px; }
        .finding .rec b { color:var(--gold); font-weight:600; }
        .group-h { font-size:13px; color:var(--muted); margin:26px 0 4px; font-weight:600; }
        .note { color:var(--muted); font-size:13px; }
        .method { color:var(--muted); font-size:12.5px; line-height:1.7; }
        .loading { color:var(--muted); padding:60px 0; text-align:center; }
        .rgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:22px; }
        .rcard { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 18px 16px;
            text-decoration:none; color:inherit; transition:border-color .18s, transform .18s; }
        .rcard:hover { border-color:var(--accent); transform:translateY(-2px); }
        .rcard .rname { font-weight:700; font-size:15px; margin-bottom:6px; word-break:break-word; }
        .rcard .rmeta { font-size:12px; color:var(--muted,#8b93b0); margin-bottom:12px; }
        .rcard .rpills { display:flex; gap:6px; flex-wrap:wrap; }
        .rp { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
        .rp.high { background:rgba(255,125,115,.16); color:#ff9d95; }
        .rp.medium { background:rgba(240,179,85,.16); color:#f0b355; }
        .rp.low { background:rgba(99,179,255,.16); color:#63b3ff; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <span>Code Brain · Architecture Report</span>
            <a class="back" id="back" href="code-brain.html">← Back to the graph</a>
        </div>
        <div id="content"><div class="loading">Loading report…</div></div>
    </div>

    <script>
    (function () {
        'use strict';
        var params = new URLSearchParams(location.search);
        var repoId = params.get('repo');
        var content = document.getElementById('content');
        if (repoId) document.getElementById('back').href = 'code-brain.html';

        function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
        function cap(s){ return String(s||'').replace(/_/g,' '); }

        if (!repoId) { renderIndex(); return; }

        Promise.all([
            fetch('structure/' + repoId + '.deep.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
            fetch('forks.json').then(function(r){ return r.json(); }).catch(function(){ return { forks: [] }; })
        ]).then(function (res) {
            var d = res[0];
            var meta = (res[1].forks || []).find(function(f){ return String(f.id) === String(repoId); }) || {};
            render(d, meta);
        });

        function render(d, meta) {
            var name = (d && d.name) || meta.displayName || meta.name || repoId;
            document.title = name + ' - Architecture Report | Code Brain';

            if (!d || !d.deep || !d.nodes || !d.nodes.length) {
                content.innerHTML =
                    '<h1>' + esc(name) + '</h1>' +
                    '<p class="lede">' + esc(meta.summary || meta.description || '') + '</p>' +
                    '<hr class="rule"><p class="note">No deep analysis is available for this repository yet - it is either awaiting the next analysis pass or was skipped as too large for a module-level dive. ' +
                    (meta.url ? 'View it <a href="' + esc(meta.url) + '" target="_blank" rel="noopener">on GitHub ↗</a>.' : '') + '</p>';
                return;
            }

            var t = d.totals || {}; var sev = t.severity || {high:0,medium:0,low:0}; var cats = t.categories || {};
            var scope = d.scope || {};
            var maxSev = Math.max(1, sev.high, sev.medium, sev.low);
            var catMax = Math.max.apply(null, [1].concat(Object.keys(cats).map(function(k){return cats[k];})));

            var h = '';
            h += '<h1><b>' + esc(name) + '</b></h1>';
            var lede = summarise(d, name);
            h += '<p class="lede">' + esc(lede) + '</p>';
            h += '<div class="repolinks">' +
                 (meta.url ? '<a href="' + esc(meta.url) + '" target="_blank" rel="noopener">GitHub ↗</a>' : '') +
                 '<a href="code-brain.html">Explore in the graph →</a></div>';
            h += '<hr class="rule">';

            // 01 Overview
            h += '<div class="sec"><span class="no">01</span> Overview</div>';
            h += '<div class="tiles">' +
                 tile(t.modules || d.nodes.length, 'modules') +
                 tile(t.edges != null ? t.edges : (d.links||[]).length, 'import edges') +
                 tile(t.cycles || 0, 'modules in cycles') +
                 tile(t.findings || (d.findings||[]).length, 'findings') +
                 '</div>';
            // severity bars
            h += '<div class="bars">';
            ['high','medium','low'].forEach(function(s){
                h += bar(s, sev[s]||0, maxSev, s);
            });
            h += '</div>';
            // category bars
            if (Object.keys(cats).length) {
                h += '<div class="sec" style="margin-top:26px"><span class="no">·</span> By category</div><div class="bars">';
                Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}).forEach(function(k){
                    h += bar(cap(k), cats[k], catMax, 'cat');
                });
                h += '</div>';
            }

            // 02 Structure & coupling
            var hubs = d.nodes.slice().filter(function(n){return n.kind==='module';})
                .sort(function(a,b){ return (b.ca+b.ce)-(a.ca+a.ce); }).slice(0, 14);
            if (hubs.length) {
                h += '<div class="sec"><span class="no">02</span> Structure &amp; coupling</div>';
                h += '<p class="note">Modules that many others depend on should stay stable. High fan-in with high instability = a change here ripples widest.</p>';
                h += '<table class="coupling"><thead><tr><th>Module</th><th style="text-align:right">Ca (in)</th><th style="text-align:right">Ce (out)</th><th style="text-align:right">Instability</th><th></th></tr></thead><tbody>';
                hubs.forEach(function(n){
                    h += '<tr><td class="mod">' + esc(n.full || n.name) + '</td>' +
                         '<td class="num">' + (n.ca||0) + '</td><td class="num">' + (n.ce||0) + '</td>' +
                         '<td class="num">' + (n.inst!=null?n.inst:'-') + '</td>' +
                         '<td>' + (n.cycle ? '<span class="cyc">in cycle</span>' : '') + '</td></tr>';
                });
                h += '</tbody></table>';
            }

            // 03 Findings
            var f = (d.findings || []).slice();
            h += '<div class="sec"><span class="no">03</span> Findings <span style="color:var(--muted);font-weight:400">· ranked severity × leverage × removability</span></div>';
            if (!f.length) {
                h += '<p class="note">No issues surfaced by the deterministic checks. Clean on the measured axes (coupling, cycles, size, nesting, error/resource handling, duplication).</p>';
            } else {
                ['high','medium','low'].forEach(function(s){
                    var group = f.filter(function(x){ return x.severity===s; });
                    if (!group.length) return;
                    h += '<div class="group-h">' + s.toUpperCase() + ' · ' + group.length + '</div>';
                    group.forEach(function(x){ h += finding(x); });
                });
            }

            // Methodology + scope
            h += '<hr class="rule">';
            h += '<div class="sec"><span class="no">·</span> Method &amp; scope</div>';
            h += '<p class="method">Deterministic static analysis - no LLM. The real import graph is resolved from source (Python / JS-TS) with Tarjan cycle detection; findings come from measured facts only (module coupling, cycle membership, file size, nesting depth, branch density, broad error handling, unmanaged resources, cross-file duplication). ' +
                 'Categories: clarity, efficiency, cognitive load, resilience, soundness, resource safety. ' +
                 'Scope: analyzed ' + (scope.analyzed || scope.files || '?') + ' of ' + (scope.discovered || scope.analyzed || '?') + ' code files' +
                 (scope.languages ? ' · ' + Object.keys(scope.languages).join(', ') : '') + '.</p>';

            content.innerHTML = h;
        }

        function summarise(d, name) {
            var t = d.totals || {}; var sev = t.severity || {};
            var parts = [name + ' resolves to ' + (t.modules||0) + ' internal modules across ' + ((t.edges!=null?t.edges:0)) + ' import edges'];
            if (t.cycles) parts.push(t.cycles + ' of them sit inside circular dependencies');
            var pri = (sev.high||0) ? (sev.high + ' high-severity') : ((sev.medium||0) ? (sev.medium + ' medium-severity') : 'no high-severity');
            parts.push(pri + ' findings surfaced from a deterministic pass');
            return parts.join('; ') + '.';
        }
        function tile(v, l){ return '<div class="tile"><div class="v">' + (Number(v)||0).toLocaleString() + '</div><div class="l">' + esc(l) + '</div></div>'; }
        function bar(nameLabel, n, max, cls){
            var pct = Math.round((n/max)*100);
            return '<div class="bar"><span class="name">' + esc(nameLabel) + '</span>' +
                   '<span class="track"><span class="fill ' + cls + '" style="width:' + pct + '%"></span></span>' +
                   '<span class="n">' + n + '</span></div>';
        }
        function finding(x){
            var c = x.severity || 'low';
            return '<div class="finding"><div class="head">' +
                '<span class="dot ' + c + '"></span>' +
                '<span class="ttl">' + esc(x.title) + '</span>' +
                '<span class="chip">' + esc(cap(x.category)) + '</span>' +
                (x.rank!=null ? '<span class="rankchip">rank ' + x.rank + '</span>' : '') +
                '</div>' +
                (x.file ? '<div class="loc">' + esc(x.file) + '</div>' : '') +
                (x.evidence ? '<div class="ev">' + esc(x.evidence) + '</div>' : '') +
                (x.recommendation ? '<div class="rec"><b>Fix:</b> ' + esc(x.recommendation) + '</div>' : '') +
                '</div>';
        }

        function renderIndex() {
            document.title = 'Architecture Reports | Code Brain';
            document.getElementById('back').href = 'code-brain.html';
            fetch('structure/reports.json').then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
            .then(function (reports) {
                if (!reports || !reports.length) {
                    content.innerHTML = '<h1>Architecture Reports</h1><p class="note">No reports have been generated yet. Explore the <a href="code-brain.html">Code Brain graph</a>.</p>';
                    return;
                }
                var totF = reports.reduce(function(s,r){return s+(r.findings||0);},0);
                var totM = reports.reduce(function(s,r){return s+(r.modules||0);},0);
                var cards = reports.map(function (r) {
                    var pills = '';
                    if (r.high) pills += '<span class="rp high">' + r.high + ' high</span>';
                    if (r.medium) pills += '<span class="rp medium">' + r.medium + ' med</span>';
                    if (r.low) pills += '<span class="rp low">' + r.low + ' low</span>';
                    return '<a class="rcard" href="report.html?repo=' + encodeURIComponent(r.id) + '">' +
                        '<div class="rname">' + esc(r.name) + '</div>' +
                        '<div class="rmeta">' + (r.modules||0) + ' modules · ' + (r.cycles||0) + ' in cycles</div>' +
                        '<div class="rpills">' + (pills || '<span class="rp low">clean</span>') + '</div>' +
                        '</a>';
                }).join('');
                content.innerHTML =
                    '<h1>Architecture <b>Reports</b></h1>' +
                    '<p class="lede">Deterministic static analysis across ' + reports.length + ' analyzed repositories - ' + totM.toLocaleString() + ' modules mapped, ' + totF.toLocaleString() + ' findings surfaced. Ranked by findings.</p>' +
                    '<hr class="rule"><div class="rgrid">' + cards + '</div>';
            });
        }
    })();
    </script>
</body>
</html>
