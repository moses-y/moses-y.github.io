<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Report | Code Brain</title>
    <meta name="author" content="Moses Yebei">
    <meta name="description" content="A deterministic architecture & code-health report for a repository - module coupling, import cycles, and ranked findings.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/report.css">
    <style>
        body { margin: 0; background: var(--bg-primary, #0D0A08); }
        @view-transition { navigation: auto; }

        nav.cg-nav {
            position: sticky; top: 0; z-index: 30;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 22px; gap: 16px;
            background: color-mix(in srgb, var(--bg-primary, #0D0A08) 82%, transparent);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border, rgba(255,240,228,0.09));
        }
        nav.cg-nav .cg-left { display: flex; align-items: center; gap: 18px; }
        nav.cg-nav .nav-logo { font-weight: 800; font-size: 1.1rem; text-decoration: none;
            background: var(--gradient); -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; }
        nav.cg-nav .cg-links { display: flex; gap: 14px; }
        nav.cg-nav .cg-links a { color: var(--text-secondary, #A99584); text-decoration: none;
            font-size: 0.9rem; padding: 6px 10px; border-radius: 8px; transition: .2s; }
        nav.cg-nav .cg-links a:hover { color: var(--text-primary, #F3EBE2); background: var(--bg-card); }
        nav.cg-nav .cg-links a[aria-current] { color: var(--accent, #C08457); }
        nav.cg-nav .nav-cta { color: #1a1008; font-weight: 600; font-size: 0.9rem; text-decoration: none;
            padding: 8px 16px; border-radius: 999px; background: var(--gradient); }
        @media (max-width: 820px) { nav.cg-nav .cg-links { display: none; } }

        .wrap { max-width: 900px; margin: 0 auto; padding: 34px 28px 90px; }
        .crumbs { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
        .crumbs .back {
            font-family: var(--font-mono, ui-monospace, Menlo, monospace);
            font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-secondary, #A99584); text-decoration: none;
            border: 1px solid var(--border); border-radius: 999px; padding: 7px 15px;
            background: none; cursor: pointer;
        }
        .crumbs .back:hover { color: var(--text-primary, #F3EBE2); border-color: var(--accent, #C08457); }
    </style>
</head>
<body>
    <nav class="cg-nav">
        <div class="cg-left">
            <a href="/" class="nav-logo">MY</a>
            <div class="cg-links">
                <a href="/projects.html">Projects</a>
                <a href="/knowledge-graph.html">Code Graph</a>
                <a href="/code-brain.html">Code Brain</a>
                <a href="/services.html">Services</a>
                <a href="/case-studies.html">Case Studies</a>
                <a href="/#about">About</a>
            </div>
        </div>
        <a href="https://cal.com/moses-yebei" target="_blank" rel="noopener" class="nav-cta">Book a call</a>
    </nav>

    <div class="wrap rpt">
        <div class="crumbs">
            <button type="button" class="back" id="back">&larr; Back</button>
            <span class="eyebrow">Code Brain <span aria-hidden="true">&middot;</span> Architecture report</span>
        </div>
        <div id="content"><div class="loading">Loading report&hellip;</div></div>
    </div>

    <script src="assets/js/report-render.js"></script>
    <script>
    (function () {
        'use strict';
        var params = new URLSearchParams(location.search);
        var repoId = params.get('repo');
        var content = document.getElementById('content');
        var R = window.ReportRender;

        // Opened in a new tab from the graph, history.back() would leave the tab
        // on about:blank, so fall back to a real link when there is nothing to
        // go back to. Either way the reader is never stranded.
        var back = document.getElementById('back');
        var sameOrigin = document.referrer && document.referrer.indexOf(location.origin) === 0;
        if (sameOrigin && history.length > 1) {
            back.addEventListener('click', function () { history.back(); });
        } else {
            var href = repoId ? 'code-brain.html' : '/projects.html';
            back.textContent = repoId ? '← Back to the graph' : '← Back to projects';
            back.addEventListener('click', function () { location.href = href; });
        }

        if (!repoId) {
            document.title = 'Architecture Reports | Code Brain';
            fetch('structure/reports.json').then(function (r) { return r.ok ? r.json() : []; })
                .catch(function () { return []; })
                .then(function (reports) { content.innerHTML = R.index(reports); });
            return;
        }

        Promise.all([
            fetch('structure/' + repoId + '.deep.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
            fetch('data/hygiene.json').then(function (r) { return r.ok ? r.json() : null; })
                .then(function (j) { return j && j.repos ? j.repos[String(repoId)] : null; })
                .catch(function () { return null; }),
            fetch('data/index.json').then(function (r) { return r.json(); })
                .then(function (i) {
                    return (i.repos || []).map(function (r) {
                        return { id: r.i, name: r.n, displayName: r.t, description: r.d,
                                 language: r.l, stars: r.s, url: 'https://github.com/moses-y/' + r.n,
                                 knowledgeGraph: { totalFiles: r.f } };
                    });
                })
                .catch(function () { return []; })
        ]).then(function (res) {
            var d = res[0];
            var audit = res[1];
            var meta = res[2].find(function (f) { return String(f.id) === String(repoId); }) || {};
            var name = (d && d.name) || meta.displayName || meta.name || repoId;
            document.title = name + ' - Architecture Report | Code Brain';
            content.innerHTML = R.body(d, meta, { heading: true, repoLink: 'code-brain.html', audit: audit });
            R.bindMore(content);
        });
    })();
    </script>
</body>
</html>
