<!-- 03-findings-heatmap.html - the findings strip and the contribution heatmap.
     A partial of index.html, which is assembled by scripts/build-bundles.js.
     Edit this file rather than index.html, then run that script. -->
    <!-- GitHub Contribution Heatmap -->
    <section id="findings" class="reveal">
        <div class="container">
            <div class="section-header">
                <span class="section-label">What it found</span>
                <h2 class="section-title">Reading other people's code at scale</h2>
                <p class="section-subtitle">Every number below is a live query over the estate, not a claim. Follow one.</p>
            </div>
            <div class="findings-grid" id="findings-grid">
                <p class="findings-loading">Reading the index…</p>
            </div>
        </div>
    </section>

    <section class="github-heatmap reveal">
        <div class="container">
            <div class="heatmap-container">
                <div class="heatmap-header">
                    <div>
                        <div class="heatmap-title">Recent Activity</div>
                        <div class="heatmap-subtitle" id="heatmap-count">Loading activity…</div>
                    </div>
                    <div class="heatmap-legend">
                        <span>Less</span>
                        <div class="heatmap-legend-squares">
                            <div class="heatmap-legend-square" style="background: var(--bg-card);"></div>
                            <div class="heatmap-legend-square" style="background: rgba(99, 102, 241, 0.25);"></div>
                            <div class="heatmap-legend-square" style="background: rgba(99, 102, 241, 0.5);"></div>
                            <div class="heatmap-legend-square" style="background: rgba(99, 102, 241, 0.75);"></div>
                            <div class="heatmap-legend-square" style="background: rgba(99, 102, 241, 1);"></div>
                        </div>
                        <span>More</span>
                    </div>
                </div>
                <div class="heatmap-months" id="heatmap-months"></div>
                <div class="heatmap-grid" id="heatmap-grid">
                    <div class="heatmap-loading">Loading contribution data...</div>
                </div>
            </div>
        </div>
    </section>
